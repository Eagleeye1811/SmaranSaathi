<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="MemoryMitra — a gentle companion for every memory. Cognitive games and memory assistance for elderly dementia patients, with caregiver and clinician views.">
  <meta name="theme-color" content="#2E7D6B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MemoryMitra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MemoryMitra</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #FBF7F1; /* AppColors.background — no white flash on boot */
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #FBF7F1;
      font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 400ms ease;
      z-index: 10;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash .mark {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background-color: #2E7D6B;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FBF7F1;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -1px;
      animation: breathe 2.4s ease-in-out infinite;
    }
    #splash .name { color: #2A2622; font-size: 20px; font-weight: 700; }
    #splash .tag { color: #8C8377; font-size: 14px; margin-top: -12px; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .mark { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="mark">M</div>
    <div class="name">MemoryMitra</div>
    <div class="tag">A gentle companion for every memory</div>
  </div>

  <script>
    // Flutter fires this once the first frame is painted; fade the splash out then.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
