name: smaran_saathi
description: "SmaranSaathi — a gentle companion for every memory. An AI-based cognitive gaming and memory assistance prototype for elderly dementia patients in India's North Eastern Region."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  connectivity_plus: ^7.3.1
  http: ^1.2.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^18.0.1
  flutter_dotenv: ^5.2.1
  audioplayers: ^6.1.0
  lottie: ^3.1.0
  video_player: ^2.9.2
  # Safe zone: OpenStreetMap tiles need no API key, so the map works the
  # moment the app runs. geolocator supplies the position stream and the
  # runtime permission flow.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  flutter_webrtc: ^0.12.4
  # On-device LLM inference (llama.cpp binding) for the offline Mitra companion.
  # pub.dev's published fllama is a stale 0.0.1. `main` needs Dart >=3.10 (its
  # 2026-03 rewrite onto native-assets build hooks) which this project's
  # Flutter 3.35.7/Dart 3.9.2 doesn't meet — pinned instead to the last commit
  # before that rewrite (2025-06-16, prebuilt-binary plugin build, sdk: '>=3.3.0'),
  # which still has the fllamaChat/OpenAiRequest API this integration uses.
  # Revisit once this project's Flutter SDK is upgraded past 3.10.
  fllama:
    git:
      url: https://github.com/Telosnex/fllama.git
      ref: d341e65d596e4d9dd888eab21e04eef1736fd661
  # App-private storage for the downloaded ~800MB GGUF model file.
  path_provider: ^2.1.4
  # Verifies the downloaded model file wasn't corrupted/truncated in transit.
  crypto: ^3.0.5
  image_picker: ^1.2.1
  # Asha conversational avatar: loads the deployed D-ID Vercel page.
  # permission_handler surfaces a friendly permission prompt before opening
  # the WebView so the patient isn't surprised by the system dialog.
  webview_flutter: ">=4.10.0 <4.14.0"
  webview_flutter_android: ">=4.3.0 <4.12.0"
  webview_flutter_platform_interface: ">=2.10.0 <2.15.0"
  permission_handler: ^11.3.1
  # Caregiver "Medical Reports": attaching a real MRI/EEG/blood-test document.
  # image_picker above only reaches the camera roll, and these arrive as PDFs
  # as often as photos. 11.0.3 is the newest release that still resolves on
  # this project's Dart 3.8 — 12.x requires Dart ^3.9 and breaks `pub get`.
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Drives the voice layer's silence timers without waiting on a real clock.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
    - assets/audio/
    - assets/audio/meditation/
    - assets/animations/
    - assets/videos/
    - assets/videos/yoga/
    - assets/videos/yoga/cat_cow.mp4
    - assets/videos/yoga/seated_mountain.mp4
    - assets/videos/yoga/spinal_twist.mp4
    - assets/videos/procedural_test.mp4
    - assets/videos/washing_clothes.mp4
    - assets/videos/splash_screen.mp4



  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    # Nunito only covers Latin. Hindi/Marathi (Devanagari) and Assamese
    # (Bengali script) fall back to these via AppText's fontFamilyFallback
    # rather than the OS's own default font, so regional-language text reads
    # in a consistent weight/style instead of visibly mismatching Nunito.
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
